<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pragma-own playground</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header>
    <div class="brand">
      <a href="https://github.com/AkaraChen/pragmajs">pragma-own</a>
      <span class="sub">playground</span>
    </div>
    <div class="controls">
      <label>example
        <select id="example"></select>
      </label>
      <label>runtime
        <select id="runtime">
          <option value="node">node</option>
          <option value="bun">bun</option>
          <option value="deno">deno</option>
          <option value="none">none</option>
        </select>
      </label>
      <label>file
        <select id="filename">
          <option value="playground.js">playground.js</option>
          <option value="playground.ts">playground.ts</option>
        </select>
      </label>
    </div>
  </header>
  <main>
    <section class="editor-pane">
      <textarea id="source" spellcheck="false" autocomplete="off"></textarea>
    </section>
    <section class="out-pane">
      <div id="status" class="status loading">loading wasm…</div>
      <pre id="out"></pre>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
