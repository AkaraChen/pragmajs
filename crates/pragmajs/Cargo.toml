[package]
name = "pragmajs"
version = "0.1.0"
edition = "2021"
description = "Unified CLI for pragma-own and pragma-rt: parse once, check both"
license = "MIT"

[[bin]]
name = "pragmajs"
path = "src/main.rs"

[dependencies]
flate2 = "1.1.2"
pragma-own = { path = "../own" }
pragma-parse = { path = "../parse" }
pragma-rt = { path = "../rt" }
tar = "0.4.44"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
